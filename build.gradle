plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    // 1.0.5-beta (lot 2) : Mixin (fr.pioneers.mixin, pioneers.mixins.json) : MixinGradle ecrit la table de correspondance (refmap)
    // des noms des cibles vers les noms SRG du jeu de production, et la range dans le jar
    id 'org.spongepowered.mixin' version '0.7.+'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // 1.0.5-beta (lot 2) : Mixin en developpement : configuration chargee au lancement, refmap relue avec les noms du code source
            arg '-mixin.config=pioneers.mixins.json'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

// 1.0.5-beta (lot 2) : la refmap (noms officiels -> noms SRG) est ecrite par le processeur d'annotations de Mixin a la compilation
mixin {
    add sourceSets.main, 'pioneers.refmap.json'
}

repositories {
    // 1.0.5-beta (lot 2) : processeur d'annotations de Mixin
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
    // Mekanism
    maven {
        name = 'ModMaven'
        url = 'https://modmaven.dev/'
    }
    // JEI
    maven {
        name = 'BlameJared'
        url = 'https://maven.blamejared.com/'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Mekanism : compatibilite FACULTATIVE (compat/mekanism, chargee seulement s'il est installe) ; plus lance en jeu de test
    compileOnly fg.deobf("mekanism:Mekanism:${mekanism_version}")

    // JEI : integration facultative des recettes (le mod fonctionne sans JEI)
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")

    // 1.0.5-beta (lot 2) : processeur d'annotations de Mixin (meme version que celle de Forge 47) : ecrit pioneers.refmap.json
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version: forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mekanism_version_range: mekanism_version_range,
            mod_id: mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors: mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                // 1.0.5-beta (lot 2) : Forge charge les configurations Mixin declarees ici
                'MixinConfigs'            : 'pioneers.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Copie les bibliotheques de compilation dans build/classpath (permet a Claude de verifier la compilation)
tasks.register('exportClasspath', Copy) {
    from configurations.compileClasspath
    into layout.buildDirectory.dir('classpath')
}
