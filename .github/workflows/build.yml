name: Build

# Compile le mod et lance les GameTests sur un serveur sans écran, à chaque push et à chaque pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilation (gradlew build)
        run: ./gradlew build --console=plain

      - name: GameTests (serveur sans écran)
        # Temporaire (1.0.6) : des GameTests échouent déjà sur la 1.0.5 ; ils sont triés sur la branche fix/gametests.
        # L'étape redeviendra bloquante quand la série sera verte.
        continue-on-error: true
        run: |
          set -o pipefail
          ./gradlew runGameTestServer --console=plain 2>&1 | tee gametest.log
      - name: Résumé des GameTests
        if: always()
        run: |
          {
            echo "### GameTests"
            echo "Échecs : $(grep -c 'LogTestReporter.*failed' gametest.log || true)"
            echo '```'
            grep -oE 'LogTestReporter\]: .* failed! .*' gametest.log | sed 's/LogTestReporter\]: //' | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Jar du mod
        uses: actions/upload-artifact@v4
        with:
          name: pioneers-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  jeu:
    # Démarrage réel : serveur dédié jusqu'à « Done », puis client sans écran (Xvfb) qui ouvre ce monde ; captures d'écran en artefact.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Paquets d'affichage
        run: sudo apt-get update -qq && sudo apt-get install -y -qq xvfb imagemagick libgl1-mesa-dri >/dev/null

      - name: Compilation
        run: ./gradlew build -x test --console=plain

      - name: Serveur dédié
        run: |
          mkdir -p essais && bash .github/scripts/smoke-server.sh . essais smoke | tee -a essais/verdict.txt
          grep -q "SERVEUR : TOUT EST BON" essais/verdict.txt

      - name: Client et monde
        run: |
          CLIENT_HEAP=6G bash .github/scripts/smoke-client.sh . essais smoke | tee -a essais/verdict.txt
          grep -q "CLIENT : TOUT EST BON" essais/verdict.txt

      - name: Captures et journaux
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jeu-${{ github.sha }}
          path: |
            essais/*.png
            essais/*.log
            essais/verdict.txt
            run/crash-reports/*.txt
          if-no-files-found: warn
          retention-days: 14
