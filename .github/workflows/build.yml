name: Build

# Compile le mod et lance les GameTests sur un serveur sans écran, à chaque push et à chaque pull request.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilation (gradlew build)
        run: ./gradlew build --console=plain

      - name: GameTests (serveur sans écran)
        run: ./gradlew runGameTestServer --console=plain

      - name: Jar du mod
        uses: actions/upload-artifact@v4
        with:
          name: pioneers-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14
